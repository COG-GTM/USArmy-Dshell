# SHA-pinned security scanning workflow.
#
# Closes Wave-3 of the COG-GTM Army DSOP Shift-Left review for
# COG-GTM/USArmy-Dshell. Implements the following controls:
#
#   * STIG V-220641 / NIST AC-6 / SR-3 — least-privilege workflow tokens
#     (top-level `permissions: contents: read`, no implicit write).
#   * NIST SI-7 / SR-3 — every third-party action is pinned to a full
#     commit SHA (verified via `gh api repos/<repo>/commits/<ref>`).
#   * STIG V-220632 / CWE-95 (Bandit B307/B102) — `bandit -r dshell/`
#     is enforced on every push and pull request.
#   * STIG V-220633 / CWE-327 (Bandit B324) — same Bandit run also
#     surfaces weak-hash usage that lacks `usedforsecurity=False`.
#   * NIST SI-10 — Semgrep `p/python` + `p/security-audit` curated
#     rulesets for input-validation and injection patterns.
#   * NIST SR-3 / OMB M-22-18 — `pip-audit` against the pinned
#     `requirements.txt` so fleet-wide CVE drift is detected per push.
#   * NIST IA-5 — `gitleaks` (full-history scan) blocks accidental
#     credential commits.
#   * Workflow lint: `actionlint` (via reviewdog/action-actionlint)
#     gates the YAML itself so future Wave-N edits cannot regress.
name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # reviewdog/action-actionlint v1.x
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d
        with:
          fail_on_error: true

  bandit:
    name: bandit (B307/B324)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --no-cache-dir "bandit==1.7.9"
      - name: Run Bandit
        run: python -m bandit -r dshell/ -ll

  semgrep:
    name: semgrep (p/python + p/security-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --no-cache-dir "semgrep==1.140.0"
      - name: Run Semgrep
        run: semgrep --error --config p/python --config p/security-audit dshell/

  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --no-cache-dir "pip-audit==2.7.3"
      - name: Audit pinned requirements
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --strict
          else
            echo "requirements.txt not present yet (Wave-1 PR pending merge); skipping."
          fi

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2 — full history needed for gitleaks
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action v2.3.9
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
