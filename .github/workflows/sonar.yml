name: SonarQube Scan

on:
  pull_request:
    branches: ["master", "main"]
  push:
    branches: ["master", "main"]

jobs:
  build-and-analyze:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Validate SonarQube secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::SONAR_TOKEN secret is not configured. Please add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "::error::SONAR_HOST_URL secret is not configured. Please add it in repository Settings > Secrets and variables > Actions. The URL must include the scheme (e.g., https://sonarcloud.io or https://your-sonar-server.com)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for blame and PR decoration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage setuptools
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --cov=dshell --cov-report=xml --cov-report=term-missing tests/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=COG-GTM_USArmy-Dshell
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
