# SonarQube Scanner Configuration for Dshell
# Network Forensic Analysis Framework

sonar.projectKey=COG-GTM_USArmy-Dshell
sonar.projectName=USArmy-Dshell
sonar.projectVersion=3.2.3
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=dshell
sonar.tests=tests

# Exclusions - generated code, build artifacts, data files
sonar.exclusions=**/build/**,**/dist/**,**/*.egg-info/**,**/data/**,**/__pycache__/**

# Test exclusions
sonar.test.exclusions=**/test_*.py,**/*_test.py

# Python coverage report path (coverage.py XML output)
sonar.python.coverage.reportPaths=coverage.xml

# Python version
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Pull Request decoration (CI usually sets these automatically)
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=
